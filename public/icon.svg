<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="nucleusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" stroke="#334155" stroke-width="4"/>
  
  <!-- Orbit 1 -->
  <ellipse cx="256" cy="256" rx="180" ry="65" fill="none" stroke="url(#orbitGrad1)" stroke-width="5" transform="rotate(30, 256, 256)" filter="url(#glow)"/>
  <!-- Electron 1 -->
  <circle cx="100" cy="210" r="10" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Orbit 2 -->
  <ellipse cx="256" cy="256" rx="180" ry="65" fill="none" stroke="url(#orbitGrad1)" stroke-width="5" transform="rotate(-30, 256, 256)" filter="url(#glow)"/>
  <!-- Electron 2 -->
  <circle cx="410" cy="210" r="10" fill="#818cf8" filter="url(#glow)"/>

  <!-- Orbit 3 -->
  <ellipse cx="256" cy="256" rx="180" ry="65" fill="none" stroke="url(#orbitGrad1)" stroke-width="5" transform="rotate(90, 256, 256)" opacity="0.8"/>
  <!-- Electron 3 -->
  <circle cx="256" cy="76" r="10" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Nucleus -->
  <circle cx="256" cy="256" r="42" fill="url(#nucleusGrad)" filter="url(#glow)"/>
  <circle cx="244" cy="244" r="14" fill="#fda4af" opacity="0.8"/>
  <text x="256" y="264" fill="#ffffff" font-size="28" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="-1">118</text>
</svg>
